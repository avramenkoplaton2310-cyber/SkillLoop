<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Взаимка — обмен цифровыми навыками</title>
<meta name="description" content="Бесплатная платформа взаимопомощи: обменивайтесь навыками (программирование, монтаж, дизайн, переводы, учёба) без денег.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3FB;--surface:#fff;--ink:#1B1838;--muted:#6A6786;--line:#E4E2F2;--win:#5B3DF5;--win-soft:#ECE8FF;--vol:#0B8F6E;--vol-soft:#DDF5EC;--on:#fff;--shadow:0 10px 30px rgba(40,30,110,.10);
--hf:'Unbounded','Manrope',system-ui,sans-serif;--bf:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122B;--surface:#1E1B3D;--ink:#F1F0FF;--muted:#A9A6C8;--line:#322E5C;--win:#9C86FF;--win-soft:#2B2560;--vol:#3DD6A8;--vol-soft:#12403A;--on:#14122B;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122B;--surface:#1E1B3D;--ink:#F1F0FF;--muted:#A9A6C8;--line:#322E5C;--win:#9C86FF;--win-soft:#2B2560;--vol:#3DD6A8;--vol-soft:#12403A;--on:#14122B;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--bf);--ac:var(--win);--ac-soft:var(--win-soft);transition:background .3s}
body[data-mode="vol"]{--ac:var(--vol);--ac-soft:var(--vol-soft)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{font:700 20px var(--hf);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:12px;background:var(--ac);display:grid;place-items:center;color:var(--on);font-size:18px;transition:background .3s}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;background:var(--ac);color:var(--on);transition:transform .15s,background .3s,opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--ac-soft);color:var(--ac)}
.btn.sm{padding:9px 14px;font-size:14px;width:100%}
.hero{padding:26px 0 22px;text-align:center}
.hero h1{font:700 clamp(28px,6vw,46px)/1.12 var(--hf);letter-spacing:-.03em;margin:0 auto 14px;max-width:16em}
.hero p{margin:0 auto;max-width:34em;color:var(--muted);font-size:17px}
.swap{display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-weight:800}
.swap span.c{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 18px;min-width:120px;transition:opacity .3s,transform .3s}
.swap span.c.out{opacity:0;transform:translateY(6px)}
.swap i{font-style:normal;color:var(--ac);font-size:22px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:560px;margin:26px auto 28px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:17px;background:var(--ac);transition:transform .35s cubic-bezier(.5,.1,.2,1),background .3s}
.tabs[data-active="vol"] .pill{transform:translateX(100%)}
.tab{position:relative;z-index:1;border:0;background:none;padding:12px 8px;border-radius:17px;font-weight:800;line-height:1.2;transition:color .3s}
.tab small{display:block;font-weight:600;opacity:.75;font-size:12.5px;margin-top:2px}
.tab[aria-selected="true"]{color:var(--on)}
.panel{animation:in .4s ease both}
.panel[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px}
.match label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.match .arrow{font-size:24px;color:var(--ac);padding-bottom:8px}
input,textarea,select{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:none}
textarea{resize:vertical;min-height:84px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 14px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.sub-toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:18px;max-width:100%}
.sub-toggle button{border:0;background:none;padding:9px 14px;border-radius:12px;font-weight:800;font-size:14.5px;color:var(--muted);transition:all .25s}
.sub-toggle button[aria-pressed="true"]{background:var(--ac-soft);color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bar .sub-toggle{flex:1;margin:0;min-width:0}
.bar .sub-toggle button{flex:1;padding:9px 8px}
.lupa{flex:none;width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:all .25s}
.lupa svg{width:21px;height:21px}
.lupa[aria-expanded="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.sbox{margin-bottom:14px;animation:in .25s ease both}
.sbox[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.new{animation:pop .6s cubic-bezier(.3,1.4,.5,1) both;border-color:var(--ac)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.who h3{margin:0;font-size:17px;line-height:1.2}
.who .s{margin:0;font-size:13px;color:var(--muted)}
.score{margin-left:auto;font-size:12.5px;font-weight:800;background:var(--ac-soft);color:var(--ac);padding:4px 10px;border-radius:999px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:13px;font-weight:800;color:var(--muted);width:54px}
.tag{font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tag.hit{background:var(--ac-soft);border-color:var(--ac);color:var(--ac)}
.kind{align-self:flex-start;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--ac-soft);color:var(--ac)}
.card h4{margin:0;font-size:17px;line-height:1.3}
.txt{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.empty{grid-column:1/-1;text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:34px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
dialog{border:0;border-radius:28px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:pop .3s ease both}
dialog::backdrop{background:rgba(20,15,50,.55);backdrop-filter:blur(3px)}
.box{padding:22px}
.box h2{font:700 20px var(--hf);margin:0 0 4px;letter-spacing:-.02em}
.box .ctx{margin:0 0 14px;color:var(--muted);font-size:14px}
.x{float:right;border:0;background:var(--bg);width:34px;height:34px;border-radius:12px;font-size:18px}
.msgs{display:flex;flex-direction:column;gap:8px;height:min(300px,40dvh);overflow:auto;padding:12px;background:var(--bg);border-radius:18px;margin-bottom:10px}
.m{max-width:82%;padding:9px 13px;border-radius:16px;font-size:15px;animation:pop .25s ease both;word-wrap:break-word}
.m.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.out{align-self:flex-end;background:var(--ac);color:var(--on);border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.send{display:flex;gap:8px}.send .btn{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:16px;margin:14px 0}
.seg button{border:0;background:none;border-radius:12px;padding:10px 6px;font-weight:800;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on)}
.f{display:grid;gap:12px}
.f fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
.f fieldset[hidden]{display:none}
.f label{font-weight:800;font-size:14px;display:grid;gap:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}.acts .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:700;opacity:0;pointer-events:none;transition:all .35s;z-index:99;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:36px 0 28px}
@media(max-width:640px){.match{grid-template-columns:1fr}.match .arrow{text-align:center;padding:0;transform:rotate(90deg)}.two{grid-template-columns:1fr}.top .btn span{display:none}.swap span.c{min-width:100px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-mode="win">
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">⇄</span>Взаимка</div>
    <button class="btn" id="addBtn">+ <span>Добавить заявку</span></button>
  </header>

  <section class="hero">
    <h1>Научу тебя — научишь меня</h1>
    <p>Бесплатный обмен цифровыми навыками. Никаких денег и посылок — только знания и помощь.</p>
    <div class="swap" aria-hidden="true"><span class="c" id="s1">Монтаж</span><i>⇄</i><span class="c" id="s2">Python</span></div>
  </section>

  <div class="tabs" id="tabs" data-active="win" role="tablist">
    <span class="pill"></span>
    <button class="tab" role="tab" id="tab-win" aria-selected="true" aria-controls="p-win">Win-Win<small>Бартер навыков</small></button>
    <button class="tab" role="tab" id="tab-vol" aria-selected="false" aria-controls="p-vol">Волонтёрство<small>За спасибо</small></button>
  </div>

  <main>
    <section class="panel" id="p-win" role="tabpanel" aria-labelledby="tab-win">
      <div class="match">
        <div><label for="need">Мне нужно</label><input id="need" list="skills" placeholder="Например, Монтаж" autocomplete="off"></div>
        <div class="arrow" aria-hidden="true">⇄</div>
        <div><label for="can">Я могу взамен</label><input id="can" list="skills" placeholder="Например, Python" autocomplete="off"></div>
      </div>
      <datalist id="skills"><option>Монтаж</option><option>Python</option><option>JavaScript</option><option>Дизайн</option><option>Figma</option><option>Перевод</option><option>Английский</option><option>Математика</option></datalist>
      <div class="head"><span id="winCount"></span></div>
      <div class="grid" id="winGrid"></div>
    </section>

    <section class="panel" id="p-vol" role="tabpanel" aria-labelledby="tab-vol" hidden>
      <div class="bar"><div class="sub-toggle" id="sub">
        <button data-v="seek" aria-pressed="true">Ищу бесплатную помощь</button>
        <button data-v="give" aria-pressed="false">Хочу помочь просто так</button>
      </div>
      <button class="lupa" id="lupa" aria-label="Поиск по заявкам" aria-expanded="false" aria-controls="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div>
      <div class="sbox" id="sbox" hidden><input id="vq" type="search" placeholder="Что вам нужно? Например: логотип, перевод, Git" autocomplete="off" aria-label="Поиск по заявкам"></div>
      <div class="head"><span id="volHint"></span></div>
      <div class="grid" id="volGrid"></div>
    </section>
  </main>
  <footer>Прототип: данные хранятся только в этой вкладке</footer>
</div>

<dialog id="chat"><div class="box">
  <button class="x" data-close aria-label="Закрыть">✕</button>
  <h2 id="chatName"></h2><p class="ctx" id="chatCtx"></p>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="send" id="chatForm"><input id="chatIn" placeholder="Напишите сообщение" autocomplete="off" required><button class="btn">Отправить</button></form>
</div></dialog>

<dialog id="add"><div class="box">
  <button class="x" data-close aria-label="Закрыть">✕</button>
  <h2>Новая заявка</h2>
  <div class="seg" id="addMode"><button type="button" data-m="win" aria-pressed="true">Win-Win</button><button type="button" data-m="vol" aria-pressed="false">Волонтёрство</button></div>
  <form class="f" id="addForm">
    <label>Ваше имя<input name="name" maxlength="30" required placeholder="Например, Алексей"></label>
    <fieldset id="fWin">
      <div class="two">
        <label>Мне нужно<input name="need" maxlength="40" required placeholder="Монтаж видео"></label>
        <label>Я могу взамен<input name="can" maxlength="40" required placeholder="Python"></label>
      </div>
      <label>О себе<textarea name="wtext" maxlength="220" placeholder="Расскажите, с чем можете помочь и что хотите получить"></textarea></label>
    </fieldset>
    <fieldset id="fVol" hidden disabled>
      <label>Что вы хотите<select name="kind"><option value="task">Мне нужна помощь</option><option value="offer">Я готов помочь</option></select></label>
      <label>Тема или навык<input name="topic" maxlength="40" required placeholder="Дизайн, перевод, Git…"></label>
      <label>Подробности<textarea name="vtext" maxlength="220" placeholder="Опишите задачу или с чем можете помочь"></textarea></label>
    </fieldset>
    <div class="acts"><button type="button" class="btn ghost" data-close>Отмена</button><button class="btn">Опубликовать</button></div>
  </form>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#5B3DF5','#E5484D','#0B8F6E','#E8801A','#2F7DE1','#C23FA8'];
let uid=100,mode='win',vol='seek',curColor=0;
const wins=[
{id:1,name:'Аня К.',can:['Монтаж видео','Premiere'],need:['Python','Telegram-боты'],text:'Монтирую ролики для блогеров. Хочу сделать бота для своих подписчиков.'},
{id:2,name:'Дима С.',can:['Python','Django'],need:['Дизайн','Figma'],text:'Бэкенд-разработчик. Нужен логотип и макет лендинга для пет-проекта.'},
{id:3,name:'Лена М.',can:['Перевод','Английский'],need:['Монтаж видео'],text:'Переведу тексты и субтитры EN↔RU. Ищу, кто смонтирует влог.'},
{id:4,name:'Тимур Р.',can:['Figma','UI-дизайн'],need:['JavaScript','React'],text:'Рисую интерфейсы. Хочу научиться верстать их сам.'},
{id:5,name:'Соня В.',can:['Математика','Подготовка к ЕГЭ'],need:['Английский'],text:'Объясняю математику простым языком. Готовлюсь к IELTS.'},
{id:6,name:'Игорь Л.',can:['JavaScript','React'],need:['Монтаж видео','Motion'],text:'Фронтендер. Хочу делать анимированные превью к своим урокам.'},
{id:7,name:'Мария Т.',can:['Английский','Перевод'],need:['Python','Excel'],text:'Редактор и переводчик. Нужно автоматизировать отчёты.'},
{id:8,name:'Артём Б.',can:['Монтаж видео','After Effects'],need:['Перевод','Английский'],text:'Видеомонтажёр. Ищу помощь с английскими субтитрами к фильму.'}
].map((p,i)=>({...p,color:COL[i%6]}));
const vols=[
{id:11,type:'task',name:'Школа «Добрый код»',topic:'Дизайн',title:'Нужен логотип для школьного кружка',text:'Кружок программирования для подростков. Хватит простого логотипа и пары цветов.'},
{id:12,type:'task',name:'Катя',topic:'Перевод',title:'Проверить перевод резюме на английский',text:'Студентка, подаюсь на стажировку. Нужен свежий взгляд на формулировки.'},
{id:13,type:'task',name:'Приют «Лапки»',topic:'Монтаж видео',title:'Смонтировать ролик на 2 минуты',text:'Есть отснятый материал. Хотим рассказать о питомцах, которые ищут дом.'},
{id:14,type:'task',name:'Олег',topic:'Git',title:'Разобраться с Git перед стажировкой',text:'Нужен час созвона, чтобы понять ветки и pull request.'},
{id:15,type:'offer',name:'Никита',topic:'Монтаж видео',title:'Смонтирую ролик до 3 минут',text:'Начинающий монтажёр, набираю портфолио. Бесплатно, нужна только ссылка на готовое видео.'},
{id:16,type:'offer',name:'Вера',topic:'Математика',title:'Помогу с математикой за 7–9 класс',text:'Студентка педвуза. Разберём темы и домашку онлайн.'},
{id:17,type:'offer',name:'Руслан',topic:'Python',title:'Посмотрю ваш учебный проект',text:'Разработчик с опытом 4 года. Сделаю код-ревью и подскажу, что улучшить.'},
{id:18,type:'offer',name:'Алина',topic:'Перевод',title:'Переведу текст EN↔RU до 1 страницы',text:'Учусь на переводчика. Нужна практика, поэтому без оплаты.'}
].map((p,i)=>({...p,color:COL[(i+2)%6]}));

const ini=n=>esc(n.replace(/[«»"]/g,'').trim().slice(0,1).toUpperCase());
const m=(q,list)=>!!q&&list.some(s=>{s=s.toLowerCase();return s.includes(q)||q.includes(s)});
const tags=(l,q)=>l.map(t=>`<span class="tag${m(q,[t])?' hit':''}">${esc(t)}</span>`).join('');

function renderWin(){
  const q1=$('#need').value.trim().toLowerCase(),q2=$('#can').value.trim().toLowerCase(),on=q1||q2;
  let l=wins.map(p=>({...p,score:(m(q1,p.can)?1:0)+(m(q2,p.need)?1:0)}));
  if(on)l=l.filter(p=>p.score>0);
  l.sort((a,b)=>b.score-a.score||(b.isNew?1:0)-(a.isNew?1:0));
  $('#winCount').textContent=on?`Подходящих людей: ${l.length}`:`Все участники: ${l.length}`;
  $('#winGrid').innerHTML=l.length?l.map(p=>`<article class="card${p.isNew?' new':''}">
    <div class="who"><span class="av" style="background:${p.color}">${ini(p.name)}</span><div><h3>${esc(p.name)}</h3><p class="s">${p.isNew?'Ваша заявка':'Участник'}</p></div>${on?`<span class="score">Совпадение ${p.score} из ${(q1&&q2)?2:1}</span>`:''}</div>
    <div class="row"><span class="lab">Может</span>${tags(p.can,q1)}</div>
    <div class="row"><span class="lab">Нужно</span>${tags(p.need,q2)}</div>
    <p class="txt">${esc(p.text)}</p>

  const toks=norm(q).filter(t=>t.length>1);if(!toks.length)return 1;

}
